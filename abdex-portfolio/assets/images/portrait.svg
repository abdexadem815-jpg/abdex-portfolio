<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2337"/>
      <stop offset="50%" stop-color="#171A2B"/>
      <stop offset="100%" stop-color="#0F121E"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="60%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4B5E8A" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#23283E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#171A2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C334B"/>
      <stop offset="40%" stop-color="#202538"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6076A9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B4868" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  <rect width="600" height="700" fill="url(#rimLight)"/>

  <!-- Subtle Developer Grid Pattern in Background -->
  <g stroke="#2C334B" stroke-width="1" opacity="0.15">
    <line x1="50" y1="0" x2="50" y2="700"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="250" y1="0" x2="250" y2="700"/>
    <line x1="350" y1="0" x2="350" y2="700"/>
    <line x1="450" y1="0" x2="450" y2="700"/>
    <line x1="550" y1="0" x2="550" y2="700"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <!-- Elegant Developer Silhouette -->
  <g id="portrait-figure">
    <!-- Back Rim Light Curve -->
    <path d="M 210 240 Q 200 160 300 150 Q 400 160 390 240 Q 380 320 300 330 Q 220 320 210 240 Z" fill="none" stroke="url(#highlight)" stroke-width="3" opacity="0.7" filter="url(#subtleGlow)"/>

    <!-- Head / Hair Silhouette -->
    <path d="M 215 240 C 205 160 250 145 300 145 C 350 145 395 160 385 240 C 375 320 345 335 300 335 C 255 335 225 320 215 240 Z" fill="url(#silhouetteGrad)"/>

    <!-- Neck -->
    <path d="M 265 315 L 265 385 L 335 385 L 335 315 Z" fill="#1C2030"/>

    <!-- Shoulders & Torso with tailored posture -->
    <path d="M 120 700 L 150 490 C 170 420 230 400 270 390 L 330 390 C 370 400 430 420 450 490 L 480 700 Z" fill="url(#silhouetteGrad)"/>

    <!-- Collar and Tie/Lapel Lines -->
    <path d="M 270 390 L 300 480 L 330 390" fill="none" stroke="#3D4766" stroke-width="2"/>
    <path d="M 220 440 L 290 530 L 295 700" fill="none" stroke="#2B3248" stroke-width="1.5"/>
    <path d="M 380 440 L 310 530 L 305 700" fill="none" stroke="#2B3248" stroke-width="1.5"/>
  </g>

  <!-- Minimalist Monogram Badge -->
  <g transform="translate(300, 620)" text-anchor="middle">
    <rect x="-85" y="-22" width="170" height="40" rx="4" fill="#121524" stroke="#2C334B" stroke-width="1"/>
    <text y="5" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" letter-spacing="3">ABDEX</text>
  </g>
</svg>
